<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>御坂 · 控制台</title>
<style>
:root{--bg:#080a0f;--panel:#12161f;--panel2:#161b25;--line:#1f2533;--txt:#e9edf6;--dim:#8791a6;
 --accent:#ff5f7e;--accent2:#ffa26b;--ok:#3ddc97;--blue:#7aa2ff;--shadow:0 12px 40px rgba(0,0,0,.35)}
[data-theme="light"]{--bg:#f5f6fa;--panel:#ffffff;--panel2:#fbfcff;--line:#e4e8f0;--txt:#1b2230;--dim:#6b7689;
 --shadow:0 10px 30px rgba(20,30,60,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;min-height:100vh}
[data-theme="dark"] body{background:radial-gradient(1000px 520px at 8% -12%,#1d1224,#080a0f 62%)}
aside{width:190px;flex:none;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
[data-theme="dark"] aside{background:rgba(10,13,19,.85)}
.brand{font-size:16px;font-weight:680;margin:2px 6px;letter-spacing:.02em}
.brand small{display:block;color:var(--dim);font-weight:400;font-size:11.5px;margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 8px var(--ok)}
nav{margin-top:16px;overflow:auto}
nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;color:var(--dim);font-size:13.5px;margin-bottom:2px;text-decoration:none;white-space:nowrap}
nav a:hover{background:var(--panel);color:var(--txt)}
nav a.on{background:linear-gradient(90deg,rgba(255,95,126,.18),rgba(255,95,126,.02));color:var(--txt);box-shadow:inset 0 0 0 1px rgba(255,95,126,.22)}
nav b{width:16px;text-align:center;font-weight:400}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.side-foot button{flex:1}
main{flex:1;padding:22px 26px;overflow:auto;min-width:0}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:21px;margin:0}
.sub{color:var(--dim);font-size:12.5px}
.state{margin-left:auto;padding:5px 13px;border-radius:999px;font-size:12.5px;background:rgba(255,95,126,.14);color:#ff96a8}
[data-theme="light"] .state{background:#ffe9ee;color:#d1435f}
#banner{display:none;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:#2a1620;border:1px solid #4a2434;color:#ff9db0;font-size:13px}
section{display:none;animation:fade .16s ease}
section:target{display:block}
body:not(:has(section:target)) #overview{display:block}
body:has(section:target) #overview:not(:target){display:none}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:11px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.card .k{color:var(--dim);font-size:12.5px}
.card .v{font-size:24px;font-weight:680;margin-top:4px}
.card .h{color:var(--dim);font-size:11.5px;opacity:.85}
.row2{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:start}
@media (max-width:900px){.row2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.02em}
canvas{display:block;width:100%;height:auto}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;font-size:12px;background:rgba(255,95,126,.1);border:1px solid rgba(255,95,126,.26);color:#ff9db0;text-decoration:none}
[data-theme="light"] .chip{background:#ffeef2;border-color:#ffd2dc;color:#c2395a}
.chip.g{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3);color:#4ade96}
[data-theme="light"] .chip.g{background:#e6fbf1;border-color:#b9efd6;color:#0f8f60}
.chip.d{background:transparent;border-color:var(--line);color:var(--dim)}
.chip[data-sw]{cursor:pointer;user-select:none}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.list .it:last-child{border-bottom:0}
.it .t{color:var(--dim);font-size:11.5px;white-space:nowrap;min-width:92px;padding-top:1px}
.it .x{flex:1;color:var(--txt);word-break:break-word}
.empty{color:var(--dim);font-size:13px;padding:10px 0;opacity:.8}
button{background:linear-gradient(180deg,var(--accent),#e04a68);border:0;color:#fff;padding:8px 15px;border-radius:10px;font-size:13px;cursor:pointer}
button:active{transform:translateY(1px)}
button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
button.mini{padding:3px 9px;font-size:11.5px;border-radius:7px}
button.sm{padding:6px 12px;font-size:12px}
.bar-actions{display:flex;gap:9px;margin:12px 0;flex-wrap:wrap;align-items:center}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 10px;font-size:13px;width:190px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg span{padding:5px 11px;border-radius:8px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.seg span.on{background:rgba(255,95,126,.14);color:#ffb3c2;border-color:rgba(255,95,126,.35)}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--dim);overflow:auto;max-height:360px;white-space:pre-wrap}
#toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);padding:10px 15px;border-radius:11px;font-size:13px;opacity:0;transform:translateY(6px);transition:.2s;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:none}
@media (max-width:720px){
  body{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}
  .brand{display:none}
  nav{display:flex;gap:6px;margin:0}
  nav a{margin:0;padding:8px 10px}
  .side-foot{margin:0;padding:0;border:0}
  main{padding:14px}
}
</style>
</head>
<body>
<aside>
  <div class="brand">御坂 · 控制台<small><span class="dot"></span><span id="now">连接中…</span></small></div>
  <nav id="nav">
    <a href="#overview"><b>▤</b>总览</a>
    <a href="#emotion"><b>♡</b>情绪</a>
    <a href="#memory"><b>▦</b>记忆</a>
    <a href="#chat"><b>💬</b>对话</a>
    <a href="#graph"><b>◈</b>关系网</a>
    <a href="#diary"><b>✎</b>日记</a>
    <a href="#promise"><b>◷</b>承诺</a>
    <a href="#people"><b>☺</b>人物</a>
    <a href="#style"><b>✦</b>风格</a>
    <a href="#system"><b>⚙</b>系统</a>
  </nav>
  <div class="side-foot">
    <button class="ghost sm" id="theme">明暗</button>
    <button class="ghost sm" id="refresh">刷新</button>
  </div>
</aside>

<main>
  <div id="banner"></div>
  <header>
    <h1 id="title">总览</h1>
    <div class="sub" id="sub"></div>
    <div class="state" id="state">—</div>
  </header>

  <section id="overview">
    <div class="panel" style="margin-bottom:14px">
      <h3>跟她说一句</h3>
      <div class="bar-actions" style="margin:8px 0 0">
        <input type="text" id="sayText" placeholder="以鱼片身份发到 QQ 私聊…" style="flex:1;min-width:240px" />
        <button id="btn-say">发给她</button>
        <button class="ghost" id="btn-reach">让她主动说</button>
        <button class="ghost" id="btn-tts">听她的声音</button>
      </div>
      <div id="audioBox" style="margin-top:10px"></div>
    </div>
    <div class="grid" id="counts"></div>
    <div class="sub" id="selfcheck" style="margin-top:8px"></div>
    <div class="row2" style="margin-top:14px">
      <div class="panel"><h3>情绪雷达</h3><div id="radar"></div></div>
      <div class="panel">
        <h3>近七天</h3><div id="week"></div>
        <h3 style="margin-top:14px">开关</h3><div class="chips" id="switches"></div>
        <h3 style="margin-top:14px">今天</h3><div class="chips" id="today"></div>
        <div class="bar-actions" style="margin-top:14px">
          <button class="sm" id="btn-backup">备份</button>
          <button class="ghost sm" id="btn-digest">周记</button>
        </div>
      </div>
    </div>
  </section>

  <section id="emotion">
    <div class="row2">
      <div class="panel">
        <h3>九维</h3><div class="grid" id="dims"></div>
        <div class="bar-actions" style="margin-top:12px">
          <button class="ghost sm" id="btn-tick">跑一次心跳</button>
          <button class="ghost sm" id="btn-reset">重置情绪</button>
        </div>
      </div>
      <div class="panel">
        <h3>心境曲线（喜悦 / 压力 / 依恋）</h3><div id="spark"></div>
        <div class="chips" id="emoTags" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>成长曲线（近 8 周新增记忆）</h3><div id="growth"></div></div>
    <div class="panel" style="margin-top:14px"><h3>心里挂着</h3><div class="chips" id="thoughts"></div></div>
  </section>

  <section id="memory">
    <div class="row2">
      <div class="panel"><h3>按类型分布</h3><div id="donut"></div></div>
      <div class="panel">
        <h3>搜索</h3>
        <div class="bar-actions" style="margin:0">
          <input type="text" id="search" placeholder="语义搜索记忆…" style="flex:1;min-width:180px" />
          <button class="sm" id="btn-search">搜</button>
        </div>
        <div class="bar-actions" style="margin:10px 0 0"><button class="ghost sm" id="btn-forget">删掉包含关键词的记忆</button></div>
        <div class="seg" id="segs" style="margin-top:12px">
          <span data-k="" class="on">全部</span><span data-k="note">记事</span><span data-k="open">搁着的</span>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:14px"><div class="list" id="notes"></div></div>
    <div class="panel" style="margin-top:14px">
      <h3>审核台 <span class="sub" id="reviewInfo"></span></h3>
      <div class="list" id="review"></div>
      <div class="bar-actions"><button class="ghost sm" id="btn-more">再看 40 条</button></div>
    </div>
  </section>

  <section id="chat">
    <div class="bar-actions">
      <input type="text" id="chatSearch" placeholder="搜对话…" style="flex:1;min-width:220px" />
      <button class="ghost sm" id="btn-chat-search">搜</button>
    </div>
    <div class="panel"><div class="list" id="chat"></div></div>
  </section>

  <section id="graph"><div class="panel"><div id="graphCv"></div></div></section>
  <section id="diary"><div id="diaryList"></div></section>
  <section id="promise"><div class="panel"><div class="list" id="promises"></div></div></section>
  <section id="people"><div class="panel"><div class="list" id="people"></div></div></section>
  <section id="style">
    <div class="sub">她学到的说话方式，你批了才生效</div>
    <div class="panel" style="margin-top:10px"><div class="list" id="style"></div></div>
  </section>
  <section id="system">
    <div class="row2">
      <div class="panel"><h3>备份</h3><div class="list" id="backups"></div>
        <div class="bar-actions"><button class="sm" id="btn-backup2">立即备份</button></div></div>
      <div class="panel"><h3>人格（只读）</h3><pre id="persona"></pre></div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>原始数据</h3><pre id="sys"></pre></div>
  </section>
</main>

<div id="toast"></div>
<script>
window.__localPanel = true;
window.AstrBotPluginPage = {
  ready: () => Promise.resolve(),
  apiGet: (ep) => fetch("/api/status", {cache: "no-store"}).then(r => r.json())
    .then(j => ({status: "ok", data: j.data || j})),
  apiPost: (ep, body) => fetch("/api/act", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})
  }).then(r => r.json()).then(j => ({status: "ok", data: j.data || j})),
};
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
